name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # lets deploy.yml require a green CI before deploying

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Lint, types, layering
        run: |
          ruff check .
          ruff format --check .
          mypy
          lint-imports
      - name: Unit tests
        run: pytest tests/unit -q
      - name: Start PostgreSQL, Azurite and SMTP capture (same definitions as local)
        working-directory: .
        run: docker compose --profile test up -d --wait postgres-test azurite-test mailpit
      - name: Integration tests (real services; a missing service fails, never skips)
        run: |
          source scripts/test-env.sh
          pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: az bicep install
      - name: Build and lint Bicep (warnings are errors)
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep
          az bicep build-params --file infra/main.test.bicepparam --stdout > /dev/null
          az bicep build-params --file infra/main.prod.bicepparam --stdout > /dev/null
      - name: Template security checks
        run: |
          python -m pip install pytest
          python -m pytest infra/tests -q

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build both images
        run: |
          docker build -t delivery-hub-backend:ci src/backend
          docker build -t dh-frontend:dev src/frontend
      - name: Proxy header tests
        run: src/frontend/proxy-test/run.sh dh-frontend:dev
      - name: Compose smoke test (no Azure access)
        run: |
          docker compose up --build -d --wait
          curl -fsS localhost:3000/healthz
          curl -fsS localhost:3000/api/technical/me
          curl -fsS -X POST localhost:3000/api/technical/check
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200
