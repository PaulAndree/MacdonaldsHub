[project]
name = "delivery-hub-backend"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "tzdata>=2024.1",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "azure-storage-blob>=12.22",
  "azure-identity>=1.17",
  "opentelemetry-api>=1.26",
  "opentelemetry-sdk>=1.26",
  "opentelemetry-instrumentation-fastapi>=0.47b0",
  "azure-monitor-opentelemetry>=1.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pyyaml>=6",
  "types-pyyaml>=6",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs real PostgreSQL and Azurite"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Test files have long literal rows and separators; wrapping them would only hurt readability.
"tests/**" = ["E501"]
# Literal OOXML package parts.
"app/adapters/xlsx/writer.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is pure: no I/O, adapters or entrypoints"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
  "app.services", "app.adapters", "app.api", "app.worker",
  "sqlalchemy", "alembic", "psycopg", "fastapi", "azure", "opentelemetry", "httpx",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "services do not depend on entrypoints"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["app.api", "app.worker"]
