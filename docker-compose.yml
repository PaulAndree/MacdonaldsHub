services:
  frontend:
    build: src/frontend
    ports:
      - "3000:3000"

  backend:
    build: src/backend
    ports:
      - "8000:8000"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: localdev
  
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0
    ports:
      - "127.0.0.1:10000:10000"